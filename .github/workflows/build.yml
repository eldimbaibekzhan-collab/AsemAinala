name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - run: unzip AsemAinala_source.zip
      - run: |
          cd AsemAinala
          curl -L https://services.gradle.org/distributions/gradle-8.1.1-bin.zip -o gradle-bin.zip
          unzip gradle-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: AsemAinala/app/build/outputs/apk/debug/app-debug.apk

name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: unzip AsemAinala_source.zip
      - run: cd AsemAinala && gradle wrapper --gradle-version 8.0 --warning-mode none
      - run: cd AsemAinala && chmod +x gradlew && ./gradlew assembleDebug --warning-mode none
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: AsemAinala/app/build/outputs/apk/debug/app-debug.apk
